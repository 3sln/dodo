name: Publish to npm

# Publishing a release (draft or otherwise) creates its tag and publishes the
# package. Tests run first, so a red build cannot reach the registry.
#
# Uses npm trusted publishing (OIDC). Configure 3sln/dodo and publish.yml as
# the package's GitHub Actions trusted publisher; no environment or token secret.

on:
  release:
    types:
      - published

permissions:
  contents: read
  # Required for npm provenance. Drop this, and the --provenance flag below,
  # if the repository is ever made private: provenance only works for packages
  # published from a public repository.
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version."
            echo 'Publishing would ship something other than what the release names.'
            exit 1
          fi
          echo "$TAG matches package.json."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite runs in a real browser, so one has to be there to run it in.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Show what will be published
        run: npm pack --dry-run

      # Node 24 supplies npm >=11.5.1, which can authenticate through OIDC.
      # Do not install a registry-url auth-token placeholder or NODE_AUTH_TOKEN.
      - name: Publish
        run: npm publish --access public --provenance

      - name: Summarise
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Published @3sln/dodo@$version from $TAG." >> "$GITHUB_STEP_SUMMARY"
